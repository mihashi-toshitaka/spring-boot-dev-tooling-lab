<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Spring Boot Dev Tooling Labのアカウント作成画面">
    <title>アカウント作成</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="page-title">
            <p class="eyebrow">NEW ACCOUNT</p>
            <h1 id="page-title">アカウント作成</h1>
            <p class="auth-description">ログインに使用する情報を登録します。</p>

            <aside class="notice notice-warning" aria-label="入力時の注意">
                <strong>このサイトはテスト用です。</strong>
                氏名、メールアドレス、普段使用しているパスワードなどの個人情報は入力しないでください。
            </aside>

            <form class="auth-form" th:action="@{/signup}" method="post">
                <div class="form-field">
                    <label for="username">ユーザー名</label>
                    <input id="username" name="username" type="text" th:value="${username}"
                           autocomplete="username" minlength="3" maxlength="50"
                           pattern="[A-Za-z0-9._-]+" required autofocus
                           th:attr="aria-invalid=${errors.containsKey('username')}">
                    <p class="field-hint">3〜50文字の半角英数字と . _ - が使えます。</p>
                    <p th:if="${errors.containsKey('username')}" th:text="${errors['username']}"
                       class="field-error" role="alert">ユーザー名の入力を確認してください。</p>
                </div>
                <div class="form-field">
                    <label for="password">パスワード</label>
                    <input id="password" name="password" type="password" autocomplete="new-password"
                           minlength="8" required th:attr="aria-invalid=${errors.containsKey('password')}">
                    <p class="field-hint">8文字以上、UTF-8で72バイト以内にしてください。</p>
                    <p th:if="${errors.containsKey('password')}" th:text="${errors['password']}"
                       class="field-error" role="alert">パスワードの入力を確認してください。</p>
                </div>
                <div class="form-field">
                    <label for="passwordConfirmation">パスワード（確認）</label>
                    <input id="passwordConfirmation" name="passwordConfirmation" type="password"
                           autocomplete="new-password" required
                           th:attr="aria-invalid=${errors.containsKey('passwordConfirmation')}">
                    <p th:if="${errors.containsKey('passwordConfirmation')}"
                       th:text="${errors['passwordConfirmation']}" class="field-error" role="alert">
                        確認用パスワードが一致しません。
                    </p>
                </div>
                <button class="primary-button" type="submit">アカウントを作成</button>
            </form>

            <p class="auth-navigation">既にアカウントをお持ちの場合は <a th:href="@{/login}" href="/login">ログイン</a></p>
        </section>
    </main>
</body>
</html>
