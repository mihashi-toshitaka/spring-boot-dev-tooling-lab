<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Spring Boot Dev Tooling Labのログイン画面">
    <title>ログイン</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="page-title">
            <p class="eyebrow">SPRING SECURITY</p>
            <h1 id="page-title">ログイン</h1>
            <p class="auth-description">登録したユーザー名とパスワードを入力してください。</p>

            <p th:if="${param.error}" class="notice notice-error" role="alert">
                ユーザー名またはパスワードが正しくありません。
            </p>
            <p th:if="${param.logout}" class="notice notice-success" role="status">
                ログアウトしました。
            </p>
            <p th:if="${param.registered}" class="notice notice-success" role="status">
                アカウントを作成しました。ログインしてください。
            </p>

            <form class="auth-form" th:action="@{/login}" method="post">
                <div class="form-field">
                    <label for="username">ユーザー名</label>
                    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                </div>
                <div class="form-field">
                    <label for="password">パスワード</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="primary-button" type="submit">ログイン</button>
            </form>

            <p class="auth-navigation">アカウントをお持ちでない場合は <a th:href="@{/signup}" href="/signup">新規登録</a></p>
        </section>
    </main>
</body>
</html>
