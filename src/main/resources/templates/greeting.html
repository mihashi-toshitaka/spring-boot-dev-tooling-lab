<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Spring BootとThymeleafによる基本画面">
    <title th:text="${title}">Spring Boot + Thymeleaf</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
    <main class="page-shell">
        <aside class="session-card" aria-label="ログイン情報">
            <p><strong th:text="${username}">user</strong> としてログイン中</p>
            <form th:action="@{/logout}" method="post">
                <button type="submit">ログアウト</button>
            </form>
        </aside>

        <section class="hero" aria-labelledby="page-title">
            <p class="eyebrow">SPRING ECOSYSTEM</p>
            <h1 id="page-title" th:text="${title}">Spring Boot + Thymeleaf</h1>
            <p class="lead" th:text="${message}">
                Thymeleafの画面表示が利用できます。
            </p>
        </section>

        <section class="feature-grid" aria-label="サンプル画面の特徴">
            <article class="feature-card">
                <span class="feature-number" aria-hidden="true">01</span>
                <h2>Controller</h2>
                <p>Spring MVCのModelを通して、画面に必要な値をテンプレートへ渡します。</p>
            </article>
            <article class="feature-card">
                <span class="feature-number" aria-hidden="true">02</span>
                <h2>Template</h2>
                <p><code>th:text</code>を使い、値を安全にHTMLへ出力します。</p>
            </article>
            <article class="feature-card">
                <span class="feature-number" aria-hidden="true">03</span>
                <h2>Static resources</h2>
                <p><code>static</code>ディレクトリのCSSを、コンテキストパス対応のURLで読み込みます。</p>
            </article>
        </section>

        <footer>
            <p>表示URL: <code>/greeting</code></p>
        </footer>
    </main>
</body>
</html>
